    <style>
      :root {

      /* Tech Corners */
      .corner-brackets {

        content: '';

        top: 0;
        left: 0;
        width: 8px;

        border-bottom: 2px solid var(--color-accent);

      /* ============ CYBERPUNK LAYER ============ */

      /* CRT scanlines overlay */
      .scanlines-overlay {

      /* CRT vignette */
      .crt-vignette {

      /* Neon text glow */
      .neon-text {
        text-shadow:
          0 0 4px var(--color-accent),
          0 0 12px color-mix(in srgb, var(--color-accent) 60%, transparent),
          0 0 32px color-mix(in srgb, var(--color-accent) 35%, transparent);

      .neon-border {
        box-shadow:
          0 0 5px color-mix(in srgb, var(--color-accent) 40%, transparent),
          inset 0 0 5px color-mix(in srgb, var(--color-accent) 15%, transparent);
      }

      /* Flicker animation (subtle neon instability) */
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.6; }
        94% { opacity: 1; }
        96% { opacity: 0.8; }
        97% { opacity: 1; }
      }
      .animate-flicker { animation: flicker 6s infinite; }

      /* Glitch effect — RGB split on hover/loop */
      .glitch {
        position: relative;
        display: inline-block;
      }
      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
      .glitch::before {
        color: #ff00c1;
        z-index: -1;
        animation: glitch-shift-a 4s infinite linear alternate-reverse;
      }
      .glitch::after {
        color: #00fff9;
        z-index: -2;
        animation: glitch-shift-b 3.2s infinite linear alternate-reverse;
      }
      @keyframes glitch-shift-a {
        0%, 88%, 100% { clip-path: inset(0 0 100% 0); transform: translateX(0); opacity: 0; }

      /* Reduced motion accessibility */
      @media (prefers-reduced-motion: reduce) {

      /* ============ AMBIENT BACKGROUND SYSTEM ============ */

      /* Depth vignette */
      .bg-vignette {

      /* Drifting aurora blobs */
      @keyframes drift-a {
        0%, 100% { transform: translate(0, 0) scale(1); }

        66% { transform: translate(-40px, 70px) scale(0.95); }
      }
      @keyframes drift-b {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-80px, -50px) scale(1.2); }
      }
      .bg-blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(110px);
        will-change: transform;
        pointer-events: none;
      }
      .animate-drift-a { animation: drift-a 28s ease-in-out infinite; }
      .animate-drift-b { animation: drift-b 34s ease-in-out infinite; }

      /* Deep gradient base — replaces flat black */
